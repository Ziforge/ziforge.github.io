<svg viewBox="0 0 720 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .subtitle { font-size: 10px; font-weight: 500; }
    .detail { font-size: 9px; }
    .tiny { font-size: 8px; }
    .label { font-size: 7.5px; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="720" height="150" rx="8" fill="#111"/>

  <!-- Audio Source -->
  <rect x="15" y="35" width="80" height="55" rx="5" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1"/>
  <text x="55" y="58" text-anchor="middle" fill="#5bc0be" class="detail">SOURCE</text>
  <text x="55" y="73" text-anchor="middle" fill="#999" class="tiny">Multichannel</text>

  <line x1="95" y1="62" x2="130" y2="62" stroke="#555" stroke-width="1.5"/>
  <polygon points="127,58 135,62 127,66" fill="#555"/>

  <!-- Spatial Processing -->
  <rect x="135" y="15" width="300" height="100" rx="8" fill="rgba(232,168,53,0.05)" stroke="#e8a835" stroke-width="2"/>
  <text x="285" y="37" text-anchor="middle" fill="#e8a835" class="subtitle">SPATIAL AUDIO PROCESSING</text>
  <line x1="148" y1="44" x2="422" y2="44" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>

  <rect x="150" y="52" width="85" height="30" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="192" y="65" text-anchor="middle" fill="#ccc" class="tiny">Binaural</text>
  <text x="192" y="76" text-anchor="middle" fill="#999" class="tiny">HRTF Render</text>

  <rect x="243" y="52" width="85" height="30" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="285" y="65" text-anchor="middle" fill="#ccc" class="tiny">Stereo</text>
  <text x="285" y="76" text-anchor="middle" fill="#999" class="tiny">Widening</text>

  <rect x="336" y="52" width="85" height="30" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="378" y="65" text-anchor="middle" fill="#ccc" class="tiny">Virtualisation</text>
  <text x="378" y="76" text-anchor="middle" fill="#999" class="tiny">Speaker &rarr; HP</text>

  <text x="285" y="102" text-anchor="middle" fill="#999" class="tiny">R&amp;D for Consumer &amp; Professional Audio Applications</text>

  <!-- Arrow out -->
  <line x1="435" y1="62" x2="475" y2="62" stroke="#555" stroke-width="1.5"/>
  <polygon points="472,58 480,62 472,66" fill="#555"/>

  <!-- Harman -->
  <rect x="480" y="20" width="220" height="90" rx="6" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1.5"/>
  <text x="590" y="42" text-anchor="middle" fill="#5bc0be" class="subtitle">HARMAN CORPORATION</text>
  <line x1="492" y1="49" x2="688" y2="49" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="590" y="66" text-anchor="middle" fill="#ccc" class="detail">Industry Collaboration</text>
  <text x="590" y="82" text-anchor="middle" fill="#999" class="tiny">Consumer Audio Products</text>
  <text x="590" y="94" text-anchor="middle" fill="#999" class="tiny">Professional Audio Systems</text>

  <text x="360" y="140" text-anchor="middle" fill="#444" class="label">BINAURAL &middot; STEREO PROCESSING &middot; VIRTUALISATION &middot; HARMAN CORPORATION</text>
</svg>
