<svg viewBox="0 0 720 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .subtitle { font-size: 10px; font-weight: 500; }
    .detail { font-size: 9px; }
    .tiny { font-size: 8px; }
    .label { font-size: 7.5px; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="720" height="160" rx="8" fill="#111"/>

  <!-- Field Recording -->
  <rect x="15" y="30" width="100" height="80" rx="6" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1.5"/>
  <text x="65" y="52" text-anchor="middle" fill="#5bc0be" class="subtitle">FIELD</text>
  <line x1="27" y1="59" x2="103" y2="59" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="65" y="74" text-anchor="middle" fill="#999" class="tiny">Gaulossen</text>
  <text x="65" y="86" text-anchor="middle" fill="#999" class="tiny">Nature Reserve</text>
  <text x="65" y="98" text-anchor="middle" fill="#999" class="tiny">Multi-Channel</text>

  <line x1="115" y1="70" x2="150" y2="70" stroke="#555" stroke-width="1.5"/>
  <polygon points="147,66 155,70 147,74" fill="#555"/>

  <!-- BirdNET Detection -->
  <rect x="155" y="25" width="130" height="90" rx="6" fill="rgba(232,168,53,0.06)" stroke="#e8a835" stroke-width="1.5"/>
  <text x="220" y="47" text-anchor="middle" fill="#e8a835" class="subtitle">BirdNET</text>
  <line x1="167" y1="54" x2="273" y2="54" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="220" y="70" text-anchor="middle" fill="#ccc" class="detail">Species ID</text>
  <text x="220" y="84" text-anchor="middle" fill="#999" class="tiny">CNN Classifier</text>
  <text x="220" y="96" text-anchor="middle" fill="#999" class="tiny">Batch Processing</text>
  <text x="220" y="108" text-anchor="middle" fill="#999" class="tiny">Confidence Score</text>

  <line x1="285" y1="70" x2="320" y2="70" stroke="#e8a835" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="317,66 325,70 317,74" fill="#e8a835"/>

  <!-- Analysis Pipeline -->
  <rect x="325" y="25" width="150" height="90" rx="6" fill="rgba(232,168,53,0.06)" stroke="#e8a835" stroke-width="2"/>
  <text x="400" y="47" text-anchor="middle" fill="#e8a835" class="subtitle">ANALYSIS</text>
  <line x1="337" y1="54" x2="463" y2="54" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="400" y="70" text-anchor="middle" fill="#ccc" class="detail">F0 Estimation</text>
  <text x="400" y="84" text-anchor="middle" fill="#999" class="tiny">YIN Algorithm</text>
  <text x="400" y="96" text-anchor="middle" fill="#999" class="tiny">LPC Formants</text>
  <text x="400" y="108" text-anchor="middle" fill="#999" class="tiny">Spectrogram</text>

  <line x1="475" y1="70" x2="510" y2="70" stroke="#555" stroke-width="1.5"/>
  <polygon points="507,66 515,70 507,74" fill="#555"/>

  <!-- Raven Pro / Output -->
  <rect x="515" y="25" width="185" height="90" rx="6" fill="rgba(91,192,190,0.05)" stroke="rgba(91,192,190,0.5)" stroke-width="1"/>
  <text x="607" y="47" text-anchor="middle" fill="#5bc0be" class="subtitle">PRAVEN PRO</text>
  <line x1="527" y1="54" x2="688" y2="54" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="607" y="70" text-anchor="middle" fill="#ccc" class="detail">Raven Pro Integration</text>
  <text x="607" y="84" text-anchor="middle" fill="#999" class="tiny">Selection Tables</text>
  <text x="607" y="96" text-anchor="middle" fill="#999" class="tiny">Annotation Export</text>
  <text x="607" y="108" text-anchor="middle" fill="#999" class="tiny">Automated Workflow</text>

  <text x="360" y="148" text-anchor="middle" fill="#444" class="label">FIELD RECORDING &middot; BIRDNET CNN &middot; YIN F0 &middot; LPC FORMANTS &middot; RAVEN PRO &middot; PYTHON</text>
</svg>
