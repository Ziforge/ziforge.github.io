<svg viewBox="0 0 720 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .subtitle { font-size: 10px; font-weight: 500; }
    .detail { font-size: 9px; }
    .tiny { font-size: 8px; }
    .label { font-size: 7.5px; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="720" height="160" rx="8" fill="#111"/>

  <!-- USB Host -->
  <rect x="15" y="40" width="80" height="65" rx="5" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1"/>
  <text x="55" y="63" text-anchor="middle" fill="#5bc0be" class="detail">USB HOST</text>
  <text x="55" y="78" text-anchor="middle" fill="#999" class="tiny">Full Speed</text>
  <text x="55" y="90" text-anchor="middle" fill="#999" class="tiny">12 Mbps</text>

  <line x1="95" y1="72" x2="130" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="127,68 135,72 127,76" fill="#555"/>

  <!-- TinyUSB -->
  <rect x="135" y="35" width="100" height="75" rx="5" fill="rgba(232,168,53,0.06)" stroke="#e8a835" stroke-width="1.5"/>
  <text x="185" y="55" text-anchor="middle" fill="#e8a835" class="subtitle">TinyUSB</text>
  <line x1="147" y1="62" x2="223" y2="62" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="185" y="78" text-anchor="middle" fill="#ccc" class="detail">UAC 2.0</text>
  <text x="185" y="92" text-anchor="middle" fill="#999" class="tiny">Adaptive Mode</text>
  <text x="185" y="104" text-anchor="middle" fill="#999" class="tiny">48kHz / 16-bit</text>

  <line x1="235" y1="72" x2="270" y2="72" stroke="#e8a835" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="267,68 275,72 267,76" fill="#e8a835"/>

  <!-- Ring Buffer -->
  <rect x="275" y="35" width="110" height="75" rx="5" fill="rgba(232,168,53,0.06)" stroke="#e8a835" stroke-width="1.5"/>
  <text x="330" y="55" text-anchor="middle" fill="#e8a835" class="subtitle">RING BUFFER</text>
  <line x1="287" y1="62" x2="373" y2="62" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="330" y="78" text-anchor="middle" fill="#ccc" class="detail">SRAM2 Bank</text>
  <text x="330" y="92" text-anchor="middle" fill="#999" class="tiny">Dedicated 32KB</text>
  <text x="330" y="104" text-anchor="middle" fill="#999" class="tiny">No-load Section</text>

  <line x1="385" y1="72" x2="420" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="417,68 425,72 417,76" fill="#555"/>

  <!-- DMA -->
  <rect x="425" y="42" width="70" height="60" rx="5" fill="rgba(91,192,190,0.05)" stroke="rgba(91,192,190,0.5)" stroke-width="1"/>
  <text x="460" y="64" text-anchor="middle" fill="#5bc0be" class="detail">DMA</text>
  <text x="460" y="80" text-anchor="middle" fill="#999" class="tiny">Transfer</text>
  <text x="460" y="92" text-anchor="middle" fill="#999" class="tiny">Callbacks</text>

  <line x1="495" y1="72" x2="530" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="527,68 535,72 527,76" fill="#555"/>

  <!-- SAI / Codec -->
  <rect x="535" y="35" width="100" height="75" rx="5" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1"/>
  <text x="585" y="55" text-anchor="middle" fill="#5bc0be" class="subtitle">SAI / CODEC</text>
  <line x1="547" y1="62" x2="623" y2="62" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="585" y="78" text-anchor="middle" fill="#999" class="tiny">PLLSAI2 Clock</text>
  <text x="585" y="92" text-anchor="middle" fill="#999" class="tiny">Audio I/O</text>
  <text x="585" y="104" text-anchor="middle" fill="#999" class="tiny">Stereo PCM</text>

  <!-- Output -->
  <line x1="635" y1="72" x2="660" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="657,68 665,72 657,76" fill="#555"/>
  <rect x="665" y="50" width="40" height="44" rx="4" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1"/>
  <text x="685" y="76" text-anchor="middle" fill="#5bc0be" class="tiny">OUT</text>

  <text x="360" y="150" text-anchor="middle" fill="#444" class="label">STM32L476 &middot; USB AUDIO CLASS 2.0 &middot; TINYUSB &middot; DUAL PLL CLOCKING &middot; DMA</text>
</svg>
