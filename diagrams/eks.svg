<svg viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .title { font-size: 13px; font-weight: 700; }
    .subtitle { font-size: 10px; font-weight: 500; }
    .detail { font-size: 9px; }
    .tiny { font-size: 8px; }
    .label { font-size: 7.5px; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="720" height="180" rx="8" fill="#111"/>

  <!-- Excitation -->
  <rect x="20" y="40" width="90" height="80" rx="6" fill="rgba(232,168,53,0.06)" stroke="#e8a835" stroke-width="1.5"/>
  <text x="65" y="62" text-anchor="middle" fill="#e8a835" class="subtitle">EXCITATION</text>
  <line x1="32" y1="69" x2="98" y2="69" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="65" y="85" text-anchor="middle" fill="#999" class="tiny">Burst Noise</text>
  <text x="65" y="97" text-anchor="middle" fill="#999" class="tiny">Pick Position</text>
  <text x="65" y="109" text-anchor="middle" fill="#999" class="tiny">Comb Filter</text>

  <!-- Arrow to delay -->
  <line x1="110" y1="80" x2="145" y2="80" stroke="#555" stroke-width="1.5"/>
  <polygon points="142,76 150,80 142,84" fill="#555"/>

  <!-- Delay Line (main feedback loop) -->
  <rect x="150" y="25" width="320" height="110" rx="8" fill="rgba(232,168,53,0.04)" stroke="#e8a835" stroke-width="2"/>
  <text x="310" y="47" text-anchor="middle" fill="#e8a835" class="subtitle">FEEDBACK DELAY LOOP &middot; P = SR/freq</text>
  <line x1="165" y1="54" x2="455" y2="54" stroke="rgba(232,168,53,0.15)" stroke-width="0.5"/>

  <!-- Delay line block -->
  <rect x="170" y="65" width="100" height="50" rx="4" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="220" y="85" text-anchor="middle" fill="#ccc" class="detail">Delay Line</text>
  <text x="220" y="100" text-anchor="middle" fill="#999" class="tiny">Fractional Interp</text>

  <!-- Arrow -->
  <line x1="270" y1="90" x2="300" y2="90" stroke="rgba(232,168,53,0.4)" stroke-width="1.5"/>
  <polygon points="297,86 305,90 297,94" fill="rgba(232,168,53,0.4)"/>

  <!-- Damping filter -->
  <rect x="305" y="65" width="100" height="50" rx="4" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="355" y="82" text-anchor="middle" fill="#ccc" class="detail">FIR3 Damping</text>
  <text x="355" y="97" text-anchor="middle" fill="#999" class="tiny">S brightness</text>
  <text x="355" y="109" text-anchor="middle" fill="#999" class="tiny">T60 decay</text>

  <!-- Feedback arrow (looping back) -->
  <path d="M 405 90 L 435 90 Q 450 90 450 75 Q 450 40 430 40 L 190 40 Q 170 40 170 55 L 170 65" fill="none" stroke="rgba(232,168,53,0.4)" stroke-width="1.5"/>
  <polygon points="166,62 170,70 174,62" fill="rgba(232,168,53,0.4)"/>

  <!-- Loop gain label -->
  <text x="310" y="38" text-anchor="middle" fill="#e8a835" class="tiny">loop gain rho</text>

  <!-- Output tap -->
  <line x1="435" y1="90" x2="435" y2="80" stroke="#555" stroke-width="1"/>
  <line x1="435" y1="80" x2="510" y2="80" stroke="#555" stroke-width="1.5"/>
  <polygon points="507,76 515,80 507,84" fill="#555"/>

  <!-- Dynamic Lowpass -->
  <rect x="515" y="35" width="90" height="50" rx="5" fill="rgba(91,192,190,0.05)" stroke="rgba(91,192,190,0.4)" stroke-width="1"/>
  <text x="560" y="55" text-anchor="middle" fill="#5bc0be" class="detail">DYN LP</text>
  <text x="560" y="70" text-anchor="middle" fill="#999" class="tiny">Level Comp</text>

  <!-- Output -->
  <line x1="605" y1="60" x2="635" y2="60" stroke="#555" stroke-width="1.5"/>
  <polygon points="632,56 640,60 632,64" fill="#555"/>
  <rect x="640" y="35" width="60" height="50" rx="5" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1"/>
  <text x="670" y="58" text-anchor="middle" fill="#5bc0be" class="detail">OUT</text>
  <text x="670" y="73" text-anchor="middle" fill="#666" class="tiny">Stereo</text>

  <!-- Sequencer below -->
  <rect x="515" y="100" width="185" height="38" rx="4" fill="rgba(91,192,190,0.04)" stroke="rgba(91,192,190,0.3)" stroke-width="0.5"/>
  <text x="607" y="118" text-anchor="middle" fill="#5bc0be" class="detail">32-Step Sequencer</text>
  <text x="607" y="131" text-anchor="middle" fill="#999" class="tiny">E minor pentatonic &middot; LFO pan</text>

  <!-- Bottom label -->
  <text x="360" y="172" text-anchor="middle" fill="#444" class="label">EXTENDED KARPLUS-STRONG &middot; FAUST DSP &middot; WEB / JACK / VST / BELA / DAISY</text>
</svg>
