<svg viewBox="0 0 720 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .subtitle { font-size: 10px; font-weight: 500; }
    .detail { font-size: 9px; }
    .tiny { font-size: 8px; }
    .label { font-size: 7.5px; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="720" height="160" rx="8" fill="#111"/>

  <!-- Procedural World -->
  <rect x="15" y="30" width="140" height="85" rx="6" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1.5"/>
  <text x="85" y="52" text-anchor="middle" fill="#5bc0be" class="subtitle">PROC. WORLD</text>
  <line x1="27" y1="59" x2="143" y2="59" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="85" y="74" text-anchor="middle" fill="#999" class="tiny">Terrain Generation</text>
  <text x="85" y="86" text-anchor="middle" fill="#999" class="tiny">Flora Placement</text>
  <text x="85" y="98" text-anchor="middle" fill="#999" class="tiny">Day/Night Cycle</text>

  <line x1="155" y1="72" x2="195" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="192,68 200,72 192,76" fill="#555"/>

  <!-- Ecosystem Sim -->
  <rect x="200" y="20" width="180" height="100" rx="8" fill="rgba(232,168,53,0.05)" stroke="#e8a835" stroke-width="2"/>
  <text x="290" y="42" text-anchor="middle" fill="#e8a835" class="subtitle">ECOSYSTEM SIM</text>
  <line x1="213" y1="49" x2="367" y2="49" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="290" y="66" text-anchor="middle" fill="#ccc" class="detail">Agent Behaviour</text>
  <text x="290" y="80" text-anchor="middle" fill="#999" class="tiny">Species Populations</text>
  <text x="290" y="92" text-anchor="middle" fill="#999" class="tiny">Activity Patterns</text>
  <text x="290" y="104" text-anchor="middle" fill="#999" class="tiny">Spatial Distribution</text>

  <line x1="380" y1="72" x2="420" y2="72" stroke="#e8a835" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="417,68 425,72 417,76" fill="#e8a835"/>

  <!-- Generative Music -->
  <rect x="425" y="20" width="170" height="100" rx="8" fill="rgba(232,168,53,0.05)" stroke="#e8a835" stroke-width="2"/>
  <text x="510" y="42" text-anchor="middle" fill="#e8a835" class="subtitle">GENERATIVE MUSIC</text>
  <line x1="438" y1="49" x2="582" y2="49" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="510" y="66" text-anchor="middle" fill="#ccc" class="detail">Bioacoustic Synth</text>
  <text x="510" y="80" text-anchor="middle" fill="#999" class="tiny">Cricket Stridulation</text>
  <text x="510" y="92" text-anchor="middle" fill="#999" class="tiny">Avian Syrinx</text>
  <text x="510" y="104" text-anchor="middle" fill="#999" class="tiny">Ambient Layers</text>

  <!-- Output -->
  <line x1="595" y1="72" x2="630" y2="72" stroke="#555" stroke-width="1.5"/>
  <polygon points="627,68 635,72 627,76" fill="#555"/>
  <rect x="635" y="42" width="65" height="60" rx="5" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1"/>
  <text x="667" y="65" text-anchor="middle" fill="#5bc0be" class="detail">3D</text>
  <text x="667" y="80" text-anchor="middle" fill="#5bc0be" class="detail">AUDIO</text>
  <text x="667" y="95" text-anchor="middle" fill="#999" class="tiny">Spatial</text>

  <text x="360" y="148" text-anchor="middle" fill="#444" class="label">PROTEUS-STYLE EXPLORATION &middot; PROCEDURAL WORLD &middot; BIOACOUSTIC MUSIC &middot; GODOT 4.5</text>
</svg>
