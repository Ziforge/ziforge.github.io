<svg viewBox="0 0 720 180" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .subtitle { font-size: 10px; font-weight: 500; }
    .detail { font-size: 9px; }
    .tiny { font-size: 8px; }
    .label { font-size: 7.5px; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="720" height="180" rx="8" fill="#111"/>

  <!-- ERAE II Hardware -->
  <rect x="15" y="30" width="110" height="100" rx="6" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1.5"/>
  <text x="70" y="52" text-anchor="middle" fill="#5bc0be" class="subtitle">ERAE II</text>
  <line x1="27" y1="59" x2="113" y2="59" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="70" y="74" text-anchor="middle" fill="#999" class="tiny">Hex Touch</text>
  <text x="70" y="86" text-anchor="middle" fill="#999" class="tiny">Surface</text>
  <text x="70" y="100" text-anchor="middle" fill="#999" class="tiny">SysEx API</text>
  <text x="70" y="114" text-anchor="middle" fill="#999" class="tiny">LED Feedback</text>

  <!-- Bidirectional arrow -->
  <line x1="125" y1="75" x2="165" y2="75" stroke="#e8a835" stroke-width="1.5"/>
  <polygon points="162,71 170,75 162,79" fill="#e8a835"/>
  <polygon points="128,71 120,75 128,79" fill="#e8a835"/>

  <!-- Polytone Core -->
  <rect x="170" y="20" width="220" height="120" rx="8" fill="rgba(232,168,53,0.05)" stroke="#e8a835" stroke-width="2"/>
  <text x="280" y="43" text-anchor="middle" fill="#e8a835" class="subtitle">POLYTONE ENGINE</text>
  <line x1="183" y1="50" x2="377" y2="50" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>

  <rect x="185" y="58" width="90" height="32" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="230" y="72" text-anchor="middle" fill="#ccc" class="tiny">Tuning System</text>
  <text x="230" y="83" text-anchor="middle" fill="#999" class="tiny">N-TET (12..106)</text>

  <rect x="285" y="58" width="90" height="32" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="330" y="72" text-anchor="middle" fill="#ccc" class="tiny">Isomorphic</text>
  <text x="330" y="83" text-anchor="middle" fill="#999" class="tiny">Wicki-Hayden</text>

  <rect x="185" y="98" width="90" height="32" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="230" y="112" text-anchor="middle" fill="#ccc" class="tiny">Colour Scheme</text>
  <text x="230" y="123" text-anchor="middle" fill="#999" class="tiny">Polychromatic</text>

  <rect x="285" y="98" width="90" height="32" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.3)" stroke-width="0.5"/>
  <text x="330" y="112" text-anchor="middle" fill="#ccc" class="tiny">Hex Grid</text>
  <text x="330" y="123" text-anchor="middle" fill="#999" class="tiny">42x24 px</text>

  <!-- Arrow out to MIDI -->
  <line x1="390" y1="55" x2="430" y2="55" stroke="#555" stroke-width="1.5"/>
  <polygon points="427,51 435,55 427,59" fill="#555"/>

  <!-- MPE MIDI Output -->
  <rect x="435" y="25" width="120" height="75" rx="6" fill="rgba(91,192,190,0.05)" stroke="rgba(91,192,190,0.5)" stroke-width="1"/>
  <text x="495" y="47" text-anchor="middle" fill="#5bc0be" class="subtitle">MPE MIDI</text>
  <line x1="447" y1="54" x2="543" y2="54" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="495" y="70" text-anchor="middle" fill="#999" class="tiny">Per-Note Pitch</text>
  <text x="495" y="82" text-anchor="middle" fill="#999" class="tiny">Pressure &middot; Slide</text>
  <text x="495" y="94" text-anchor="middle" fill="#999" class="tiny">Channel Rotation</text>

  <!-- Arrow out to OSC -->
  <line x1="390" y1="110" x2="430" y2="110" stroke="#555" stroke-width="1.5"/>
  <polygon points="427,106 435,110 427,114" fill="#555"/>

  <!-- OSC Output -->
  <rect x="435" y="105" width="120" height="38" rx="4" fill="rgba(91,192,190,0.04)" stroke="rgba(91,192,190,0.3)" stroke-width="0.5"/>
  <text x="495" y="121" text-anchor="middle" fill="#5bc0be" class="detail">OSC</text>
  <text x="495" y="135" text-anchor="middle" fill="#999" class="tiny">UDP Broadcast</text>

  <!-- Synth target -->
  <line x1="555" y1="62" x2="600" y2="62" stroke="#555" stroke-width="1.5"/>
  <polygon points="597,58 605,62 597,66" fill="#555"/>
  <rect x="605" y="35" width="95" height="55" rx="5" fill="rgba(91,192,190,0.06)" stroke="#5bc0be" stroke-width="1"/>
  <text x="652" y="57" text-anchor="middle" fill="#5bc0be" class="detail">SYNTH</text>
  <text x="652" y="72" text-anchor="middle" fill="#999" class="tiny">Any MPE</text>
  <text x="652" y="84" text-anchor="middle" fill="#999" class="tiny">Instrument</text>

  <text x="360" y="172" text-anchor="middle" fill="#444" class="label">MICROTONAL ISOMORPHIC &middot; N-TET &middot; MPE MIDI &middot; SYSEX LED &middot; POLYCHROMATIC &middot; PYTHON</text>
</svg>
