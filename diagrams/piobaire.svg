<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .title { font-size: 13px; font-weight: 700; }
    .subtitle { font-size: 10px; font-weight: 500; }
    .detail { font-size: 9px; }
    .tiny { font-size: 8px; }
    .label { font-size: 7.5px; letter-spacing: 0.5px; }
  </style>

  <rect x="0" y="0" width="720" height="240" rx="8" fill="#111"/>

  <!-- Title -->
  <text x="360" y="20" text-anchor="middle" fill="#444" class="label">CHANTER SIGNAL PATH</text>

  <!-- Reed Excitation -->
  <rect x="20" y="35" width="100" height="90" rx="6" fill="rgba(232,168,53,0.06)" stroke="#e8a835" stroke-width="1.5"/>
  <text x="70" y="58" text-anchor="middle" fill="#e8a835" class="subtitle">REED</text>
  <line x1="32" y1="66" x2="108" y2="66" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="70" y="82" text-anchor="middle" fill="#999" class="tiny">Bernoulli</text>
  <text x="70" y="94" text-anchor="middle" fill="#999" class="tiny">Pressure-Flow</text>
  <text x="70" y="106" text-anchor="middle" fill="#999" class="tiny">Nonlinear</text>

  <!-- Arrow -->
  <line x1="120" y1="80" x2="155" y2="80" stroke="#555" stroke-width="1.5"/>
  <polygon points="152,76 160,80 152,84" fill="#555"/>

  <!-- Bore / Waveguide -->
  <rect x="160" y="30" width="140" height="100" rx="6" fill="rgba(232,168,53,0.05)" stroke="#e8a835" stroke-width="2"/>
  <text x="230" y="53" text-anchor="middle" fill="#e8a835" class="subtitle">WAVEGUIDE BORE</text>
  <line x1="172" y1="60" x2="288" y2="60" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <!-- Bidirectional arrows inside -->
  <line x1="180" y1="75" x2="280" y2="75" stroke="rgba(232,168,53,0.4)" stroke-width="1"/>
  <polygon points="277,72 283,75 277,78" fill="rgba(232,168,53,0.4)"/>
  <line x1="280" y1="85" x2="180" y2="85" stroke="rgba(91,192,190,0.4)" stroke-width="1"/>
  <polygon points="183,82 177,85 183,88" fill="rgba(91,192,190,0.4)"/>
  <text x="230" y="103" text-anchor="middle" fill="#999" class="tiny">5 Bore Profiles</text>
  <text x="230" y="115" text-anchor="middle" fill="#999" class="tiny">Material Damping</text>

  <!-- Arrow -->
  <line x1="300" y1="80" x2="335" y2="80" stroke="#555" stroke-width="1.5"/>
  <polygon points="332,76 340,80 332,84" fill="#555"/>

  <!-- Tone Holes -->
  <rect x="340" y="30" width="140" height="100" rx="6" fill="rgba(91,192,190,0.05)" stroke="#5bc0be" stroke-width="1.5"/>
  <text x="410" y="53" text-anchor="middle" fill="#5bc0be" class="subtitle">TONE HOLES</text>
  <line x1="352" y1="60" x2="468" y2="60" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="410" y="78" text-anchor="middle" fill="#ccc" class="detail">9 Chanter Holes</text>
  <text x="410" y="93" text-anchor="middle" fill="#999" class="tiny">Kelly-Lochbaum</text>
  <text x="410" y="105" text-anchor="middle" fill="#999" class="tiny">Scattering Junctions</text>
  <text x="410" y="118" text-anchor="middle" fill="#999" class="tiny">Freq-Dependent</text>

  <!-- Arrow -->
  <line x1="480" y1="80" x2="515" y2="80" stroke="#555" stroke-width="1.5"/>
  <polygon points="512,76 520,80 512,84" fill="#555"/>

  <!-- Bell -->
  <rect x="520" y="45" width="80" height="70" rx="6" fill="rgba(91,192,190,0.05)" stroke="#5bc0be" stroke-width="1"/>
  <text x="560" y="68" text-anchor="middle" fill="#5bc0be" class="subtitle">BELL</text>
  <line x1="532" y1="75" x2="588" y2="75" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="560" y="90" text-anchor="middle" fill="#999" class="tiny">Flared Horn</text>
  <text x="560" y="102" text-anchor="middle" fill="#999" class="tiny">Radiation</text>

  <!-- Arrow to GPU -->
  <line x1="600" y1="80" x2="630" y2="80" stroke="#e8a835" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="627,76 635,80 627,84" fill="#e8a835"/>

  <!-- GPU -->
  <rect x="635" y="35" width="65" height="90" rx="6" fill="rgba(232,168,53,0.06)" stroke="#e8a835" stroke-width="1.5"/>
  <text x="667" y="58" text-anchor="middle" fill="#e8a835" class="detail">METAL</text>
  <text x="667" y="72" text-anchor="middle" fill="#e8a835" class="detail">GPU</text>
  <line x1="645" y1="79" x2="690" y2="79" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="667" y="95" text-anchor="middle" fill="#999" class="tiny">96kHz</text>
  <text x="667" y="107" text-anchor="middle" fill="#999" class="tiny">Real-time</text>

  <!-- Parallel pipes section below -->
  <rect x="20" y="145" width="680" height="70" rx="6" fill="rgba(232,168,53,0.03)" stroke="rgba(232,168,53,0.15)" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="360" y="165" text-anchor="middle" fill="#e8a835" class="subtitle">PARAPHONIC: 7 WAVEGUIDE PAIRS IN PARALLEL</text>

  <!-- Pipe labels -->
  <rect x="40" y="175" width="80" height="26" rx="3" fill="rgba(232,168,53,0.08)" stroke="rgba(232,168,53,0.2)" stroke-width="0.5"/>
  <text x="80" y="192" text-anchor="middle" fill="#ccc" class="tiny">Chanter</text>

  <rect x="135" y="175" width="80" height="26" rx="3" fill="rgba(91,192,190,0.06)" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="175" y="192" text-anchor="middle" fill="#999" class="tiny">Bass Drone</text>

  <rect x="230" y="175" width="80" height="26" rx="3" fill="rgba(91,192,190,0.06)" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="270" y="192" text-anchor="middle" fill="#999" class="tiny">Bari Drone</text>

  <rect x="325" y="175" width="80" height="26" rx="3" fill="rgba(91,192,190,0.06)" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="365" y="192" text-anchor="middle" fill="#999" class="tiny">Tenor Drone</text>

  <rect x="420" y="175" width="80" height="26" rx="3" fill="rgba(91,192,190,0.06)" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="460" y="192" text-anchor="middle" fill="#999" class="tiny">Regulator 1</text>

  <rect x="515" y="175" width="80" height="26" rx="3" fill="rgba(91,192,190,0.06)" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="555" y="192" text-anchor="middle" fill="#999" class="tiny">Regulator 2</text>

  <rect x="610" y="175" width="80" height="26" rx="3" fill="rgba(91,192,190,0.06)" stroke="rgba(91,192,190,0.2)" stroke-width="0.5"/>
  <text x="650" y="192" text-anchor="middle" fill="#999" class="tiny">Regulator 3</text>

  <!-- Bottom label -->
  <text x="360" y="233" text-anchor="middle" fill="#444" class="label">DIGITAL WAVEGUIDE SYNTHESIS &middot; C++17 &middot; APPLE METAL &middot; JUCE &middot; VST3/AU</text>
</svg>
